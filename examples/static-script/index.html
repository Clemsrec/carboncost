<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carbon Site Kit Script Tag Example</title>
  </head>
  <body>
    <h1>Carbon Site Kit (script tag example)</h1>

    <script src="https://cdn.example.com/carbon-site-kit.min.js"></script>
    <script>
      window.CarbonSiteKit.init({ endpoint: "/api/carbon" });
      const event = window.CarbonSiteKit.trackPageview({
        bytesTransferred: 1823400,
        route: "/static-page"
      });
      console.log("Page estimate", event);
    </script>
  </body>
</html>
