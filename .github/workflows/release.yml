name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Trusted publishing (OIDC) requires Node >= 22.14.0 and npm >= 11.5.1.
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Node 22 bundles npm 10, and pnpm 10 delegates `pnpm publish` to the npm
      # CLI, so the OIDC token exchange only happens with a newer npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token: publishing authenticates through trusted publishing
          # (OIDC, via id-token: write). Each package must list this repository
          # and release.yml as a trusted publisher on npmjs.com.
