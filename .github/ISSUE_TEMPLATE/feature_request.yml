name: Feature request
description: Suggest a feature for carbon-site-kit.
title: "feat: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: Describe the problem and the proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      placeholder: What problem are you solving?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: What API or behavior do you want?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
